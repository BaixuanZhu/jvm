# 打 tag (v0.1.0) 时自动编译, 产出安装器 + 便携 zip, 发 GitHub Release
# 产物:
#   jvm-windows-amd64-setup.exe   双击安装器 (给新用户)
#   jvm-windows-amd64.zip         便携版 (供 jvm upgrade 精确匹配拉取)

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # softprops/action-gh-release 需要创建 release 和上传 asset

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build jvm.exe
        run: make build

      - name: Install NSIS
        shell: pwsh
        # choco 装 NSIS 到 C:\Program Files (x86)\NSIS, 但不会刷新当前 job 的 PATH,
        # 所以下一步跑 makensis 会 "command not found"。
        # NSIS 的 makensis.exe 直接在该目录下 (无版本子目录), 故直接写这个路径。
        run: |
          choco install nsis -y --no-progress
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            throw "makensis.exe not found under $nsisDir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          Write-Host "Added to GITHUB_PATH: $nsisDir"

      - name: Verify makensis
        # 失败在这里会给出清晰错误, 而不是埋在 make 里
        shell: pwsh
        run: makensis /VERSION

      - name: Build installer
        run: make installer VERSION=${{ steps.ver.outputs.VERSION }}

      - name: Build portable zip
        # windows-latest 自带 zip (来自 Git), make release 直接用
        run: make release

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/jvm-windows-amd64-setup.exe
            dist/jvm-windows-amd64.zip
