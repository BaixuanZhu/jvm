<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
  {% seo %}
</head>
<body class="docs-page">

  {% include header.html %}

  <div class="container docs-layout">
    <aside class="docs-sidebar">
      <nav>
        <p class="sidebar-title">文档</p>
        <a href="{{ '/docs/install/' | relative_url }}"   {% if page.url contains 'install' %}class="active"{% endif %}>安装指南</a>
        <a href="{{ '/docs/commands/' | relative_url }}"  {% if page.url contains 'commands' %}class="active"{% endif %}>命令参考</a>
        <a href="{{ '/docs/distros/' | relative_url }}"   {% if page.url contains 'distros' %}class="active"{% endif %}>发行版</a>
        <a href="{{ '/docs/config/' | relative_url }}"    {% if page.url contains 'config' %}class="active"{% endif %}>配置与原理</a>
        <a href="{{ '/docs/faq/' | relative_url }}"       {% if page.url contains 'faq' %}class="active"{% endif %}>常见问题</a>
        <p class="sidebar-title">其他</p>
        <a href="{{ '/changelog/' | relative_url }}" {% if page.url contains 'changelog' %}class="active"{% endif %}>更新日志</a>
        <a href="{{ site.github_repo }}" target="_blank" rel="noopener">GitHub 仓库 ↗</a>
      </nav>
    </aside>

    <article class="docs-content">
      <h1>{{ page.title }}</h1>
      {{ content }}
    </article>
  </div>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
